<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Binance XAUUSDT Options Order Flow & Open Interest Depth</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --panel-bg: #1e2329;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --ask-color: #f6465d;
            --ask-bg: rgba(246, 70, 93, 0.12);
            --ask-bar: rgba(246, 70, 93, 0.28);
            --bid-color: #0ecb81;
            --bid-bg: rgba(14, 203, 129, 0.12);
            --bid-bar: rgba(14, 203, 129, 0.28);
            --accent: #f0b90b;
            --border-color: #2b313a;
        }
        body {
            font-family: monospace;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1250px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h2 { color: var(--accent); margin-top: 0; text-align: center; font-size: 1.2rem; }
        .status { text-align: center; color: var(--text-secondary); margin-bottom: 12px; font-size: 0.8rem; }
        .metrics-bar {
            display: flex;
            justify-content: space-around;
            background: #14171a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }
        .metric-item span { font-weight: bold; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.82rem; }
        th, td { padding: 8px 8px; border-bottom: 1px solid var(--border-color); }
        th { background: #14171a; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; }
        th:first-child, td:first-child { text-align: left; }
        .ask-row { background-color: var(--ask-bg); }
        .bid-row { background-color: var(--bid-bg); }
        .price-ask { color: var(--ask-color); font-weight: bold; }
        .price-bid { color: var(--bid-color); font-weight: bold; }
        .spread-bar { background-color: #14171a; text-align: center; color: var(--accent); font-weight: bold; padding: 8px; }
        .positive { color: var(--bid-color); }
        .negative { color: var(--ask-color); }
        .bar-cell { position: relative; z-index: 1; }
        .ask-row .bar-cell::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0;
            background-color: var(--ask-bar); z-index: -1;
            width: calc(var(--pct) * 100%);
        }
        .bid-row .bar-cell::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0;
            background-color: var(--bid-bar); z-index: -1;
            width: calc(var(--pct) * 100%);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🟡 Binance XAUUSDT Options Order Flow & Open Interest Depth</h2>
    <div class="status" id="status">Đang thiết lập kết nối đến dữ liệu Options...</div>

    <div class="metrics-bar">
        <div>Hợp đồng: <span id="symbol-name">XAUUSDT Options</span></div>
        <div>Net Tape Delta: <span id="net-delta">0.00</span></div>
        <div>Tần suất: <span>1.5s / lần</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Loại</th>
                <th>Mức Giá</th>
                <th>Size</th>
                <th>Cumulative Vol</th>
                <th>Tape Delta</th>
                <th>OI Change ($)</th>
                <th>OI-Weighted</th>
            </tr>
        </thead>
        <tbody id="dom-body">
            <!-- Dữ liệu render real-time -->
        </tbody>
    </table>
</div>

<script>
    async function fetchOrderBook() {
        try {
            let response = await fetch('/api/orderbook');
            let data = await response.json();
            
            if(data.error) {
                document.getElementById('status').innerText = "Lỗi kết nối API: " + data.error;
                return;
            }

            document.getElementById('status').innerText = `Live Real-time Options | Spread: ${data.spread}`;
            document.getElementById('symbol-name').innerText = data.symbol;
            
            let netDeltaEl = document.getElementById('net-delta');
            netDeltaEl.innerText = (data.net_delta >= 0 ? "+" : "") + data.net_delta + " HĐ";
            netDeltaEl.className = data.net_delta >= 0 ? "positive" : "negative";
            
            let html = '';

            // Render Asks
            if (data.asks && data.asks.length > 0) {
                data.asks.forEach(item => {
                    let pct = data.max_cum_ask ? (item.cumulative / data.max_cum_ask).toFixed(2) : 0;
                    let deltaClass = item.tape_delta >= 0 ? "positive" : "negative";
                    let oiClass = item.oi_change_usd >= 0 ? "positive" : "negative";
                    
                    html += `
                        <tr class="ask-row">
                            <td>ASK</td>
                            <td class="price-ask">${item.price.toLocaleString()}</td>
                            <td>${item.size.toFixed(4)}</td>
                            <td class="bar-cell" style="--pct: ${pct}">${item.cumulative.toFixed(4)}</td>
                            <td class="${deltaClass}">${item.tape_delta >= 0 ? "+" : ""}${item.tape_delta}</td>
                            <td class="${oiClass}">$${item.oi_change_usd.toLocaleString()}</td>
                            <td>${item.oi_weighted.toLocaleString()}</td>
                        </tr>
                    `;
                });
            }

            // Render Spread Bar
            html += `<tr><td colspan="7" class="spread-bar">SPREAD: ${data.spread} (Best Ask: ${data.best_ask} | Best Bid: ${data.best_bid})</td></tr>`;

            // Render Bids
            if (data.bids && data.bids.length > 0) {
                data.bids.forEach(item => {
                    let pct = data.max_cum_bid ? (item.cumulative / data.max_cum_bid).toFixed(2) : 0;
                    let deltaClass = item.tape_delta >= 0 ? "positive" : "negative";
                    let oiClass = item.oi_change_usd >= 0 ? "positive" : "negative";

                    html += `
                        <tr class="bid-row">
                            <td>BID</td>
                            <td class="price-bid">${item.price.toLocaleString()}</td>
                            <td>${item.size.toFixed(4)}</td>
                            <td class="bar-cell" style="--pct: ${pct}">${item.cumulative.toFixed(4)}</td>
                            <td class="${deltaClass}">${item.tape_delta >= 0 ? "+" : ""}${item.tape_delta}</td>
                            <td class="${oiClass}">$${item.oi_change_usd.toLocaleString()}</td>
                            <td>${item.oi_weighted.toLocaleString()}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('dom-body').innerHTML = html;
        } catch (err) {
            console.error("Lỗi fetch API:", err);
            document.getElementById('status').innerText = "Mất kết nối tới server!";
        }
    }

    setInterval(fetchOrderBook, 1500);
    fetchOrderBook();
</script>

</body>
</html>
