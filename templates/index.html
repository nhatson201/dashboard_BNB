<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Binance Advanced Order Flow DoM - XAUUSDT</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --panel-bg: #1e2329;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --ask-color: #f6465d;
            --ask-bg: rgba(246, 70, 93, 0.12);
            --ask-bar: rgba(246, 70, 93, 0.28);
            --bid-color: #0ecb81;
            --bid-bg: rgba(14, 203, 129, 0.12);
            --bid-bar: rgba(14, 203, 129, 0.28);
            --accent: #f0b90b;
            --border-color: #2b313a;
        }
        body {
            font-family: monospace;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1250px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h2 { color: var(--accent); margin-top: 0; text-align: center; font-size: 1.2rem; }
        .status { text-align: center; color: var(--text-secondary); margin-bottom: 12px; font-size: 0.8rem; }
        .metrics-bar {
            display: flex;
            justify-content: space-around;
            background: #14171a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }
        .metric-item span { font-weight: bold; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.82rem; }
        th, td { padding: 8px 8px; border-bottom: 1px solid var(--border-color); }
        th { background: #14171a; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; }
        th:first-child, td:first-child { text-align: left; }
        .ask-row { background-color: var(--ask-bg); }
        .bid-row { background-color: var(--bid-bg); }
        .price-ask { color: var(--ask-color); font-weight: bold; }
        .price-bid { color: var(--bid-color); font-weight: bold; }
        .spread-bar { background-color: #14171a; text-align: center; color: var(--accent); font-weight: bold; padding: 8px; }
        .positive { color: var(--bid-color); }
        .negative { color: var(--ask-color); }
        .bar-cell { position: relative; z-index: 1; }
        .ask-row .bar-cell::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0;
            background-color: var(--ask-bar); z-index: -1;
            width: calc(var(--pct) * 100%);
        }
        .bid-row .bar-cell::before {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0;
            background-color: var(--bid-bar); z-index: -1;
            width: calc(var(--pct) * 100%);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🟡 Binance XAUUSDT Advanced Order Flow & Open Interest Depth</h2>
    <div class="status" id="status">Đang kết nối trực tiếp tới Binance...</div>

    <div class="metrics-bar">
        <div>Cặp: <span>XAUUSDT Swap</span></div>
        <div>Net Tape Delta: <span id="net-delta">0.00</span></div>
        <div>Tần suất: <span>1.5s / lần</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Loại</th>
                <th>Mức Giá</th>
                <th>Size</th>
                <th>Cumulative Vol</th>
                <th>Tape Delta</th>
                <th>OI Change ($)</th>
                <th>OI-Weighted</th>
            </tr>
        </thead>
        <tbody id="dom-body"></tbody>
    </table>
</div>

<script>
    async function fetchOrderBook() {
        try {
            // Gọi trực tiếp API Binance từ trình duyệt (Bỏ qua hoàn toàn IP của Render)
            let [bookRes, tradesRes] = await Promise.all([
                fetch('https://fapi.binance.com/fapi/v1/depth?symbol=XAUUSDT&limit=5'),
                fetch('https://fapi.binance.com/fapi/v1/trades?symbol=XAUUSDT&limit=50')
            ]);
            
            let data = await bookRes.json();
            let trades = await tradesRes.json();
            
            if (!data.asks || !data.bids) {
                document.getElementById('status').innerText = "Lỗi phản hồi từ Binance";
                return;
            }

            let recent_delta = 0;
            if (Array.isArray(trades)) {
                trades.forEach(t => {
                    let qty = parseFloat(t.qty);
                    if (t.isBuyerMaker) {
                        recent_delta -= qty;
                    } else {
                        recent_delta += qty;
                    }
                });
            }

            let asks_raw = sortedAsks(data.asks);
            let bids_raw = sortedBids(data.bids);

            let total_ask_size = asks_raw.reduce((sum, item) => sum + item[1], 0) || 1;
            let total_bid_size = bids_raw.reduce((sum, item) => sum + item[1], 0) || 1;

            let html = '';
            let cum_ask = 0;
            let asks = asks_raw.map(([price, size]) => {
                cum_ask += size;
                let weight = size / total_ask_size;
                let step_delta = Number((recent_delta * weight).toFixed(2));
                return {
                    price, size, cumulative: cum_ask,
                    tape_delta: step_delta,
                    oi_change_usd: Number((step_delta * price * 0.5).toFixed(2)),
                    oi_weighted: Number((price * (1 + (weight * 0.0002))).toFixed(2))
                };
            });
            let max_cum_ask = cum_ask > 0 ? cum_ask : 1;

            let cum_bid = 0;
            let bids = bids_raw.map(([price, size]) => {
                cum_bid += size;
                let weight = size / total_bid_size;
                let step_delta = Number((recent_delta * weight).toFixed(2));
                return {
                    price, size, cumulative: cum_bid,
                    tape_delta: step_delta,
                    oi_change_usd: Number((step_delta * price * 0.5).toFixed(2)),
                    oi_weighted: Number((price * (1 - (weight * 0.0002))).toFixed(2))
                };
            });
            let max_cum_bid = cum_bid > 0 ? cum_bid : 1;

            let best_ask = asks_raw.length > 0 ? asks_raw[asks_raw.length - 1][0] : 0;
            let best_bid = bids_raw.length > 0 ? bids_raw[0][0] : 0;
            let spread = Number((best_ask - best_bid).toFixed(2));

            document.getElementById('status').innerText = `Live Real-time | Spread: ${spread} USDT`;
            let netDeltaEl = document.getElementById('net-delta');
            netDeltaEl.innerText = (recent_delta >= 0 ? "+" : "") + recent_delta.toFixed(2) + " HĐ";
            netDeltaEl.className = recent_delta >= 0 ? "positive" : "negative";

            // Render Asks
            asks.forEach(item => {
                let pct = (item.cumulative / max_cum_ask).toFixed(2);
                let deltaClass = item.tape_delta >= 0 ? "positive" : "negative";
                let oiClass = item.oi_change_usd >= 0 ? "positive" : "negative";
                html += `
                    <tr class="ask-row">
                        <td>ASK</td>
                        <td class="price-ask">${item.price.toLocaleString()}</td>
                        <td>${item.size.toFixed(2)}</td>
                        <td class="bar-cell" style="--pct: ${pct}">${item.cumulative.toFixed(2)}</td>
                        <td class="${deltaClass}">${item.tape_delta >= 0 ? "+" : ""}${item.tape_delta}</td>
                        <td class="${oiClass}">$${item.oi_change_usd.toLocaleString()}</td>
                        <td>${item.oi_weighted.toLocaleString()}</td>
                    </tr>
                `;
            });

            // Render Spread Bar
            html += `<tr><td colspan="7" class="spread-bar">SPREAD: ${spread} (Best Ask: ${best_ask} | Best Bid: ${best_bid})</td></tr>`;

            // Render Bids
            bids.forEach(item => {
                let pct = (item.cumulative / max_cum_bid).toFixed(2);
                let deltaClass = item.tape_delta >= 0 ? "positive" : "negative";
                let oiClass = item.oi_change_usd >= 0 ? "positive" : "negative";
                html += `
                    <tr class="bid-row">
                        <td>BID</td>
                        <td class="price-bid">${item.price.toLocaleString()}</td>
                        <td>${item.size.toFixed(2)}</td>
                        <td class="bar-cell" style="--pct: ${pct}">${item.cumulative.toFixed(2)}</td>
                        <td class="${deltaClass}">${item.tape_delta >= 0 ? "+" : ""}${item.tape_delta}</td>
                        <td class="${oiClass}">$${item.oi_change_usd.toLocaleString()}</td>
                        <td>${item.oi_weighted.toLocaleString()}</td>
                    </tr>
                `;
            });

            document.getElementById('dom-body').innerHTML = html;
        } catch (err) {
            console.error("Lỗi:", err);
            document.getElementById('status').innerText = "Đang kết nối lại với Binance...";
        }
    }

    function sortedAsks(arr) {
        return arr.map(p => [parseFloat(p[0]), parseFloat(p[1])]).sort((a, b) => b[0] - a[0]);
    }
    function sortedBids(arr) {
        return arr.map(p => [parseFloat(p[0]), parseFloat(p[1])]).sort((a, b) => b[0] - a[0]);
    }

    setInterval(fetchOrderBook, 1500);
    fetchOrderBook();
</script>

</body>
</html>
